name: Desktop client CI
on:
  pull_request:
    branches: [Master]
  push:
    branches: [Master, feat/wails-desktop-foundation]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Resolve Go dependencies
        run: go mod tidy
      - name: Test Go packages
        run: go test ./...
